name: Build ELHARIKA Electrical Designer 3D RC3

on:
  workflow_dispatch:
  push:
    paths:
      - 'ELHARIKA-Electrical-Designer-3D-v2.0.0-RC3-source.zip'
      - '.github/workflows/build-rc3-archive.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify RC3 source archive
        run: |
          test -f ELHARIKA-Electrical-Designer-3D-v2.0.0-RC3-source.zip || {
            echo 'RC3 source ZIP is missing from repository root.'
            exit 1
          }

      - name: Extract source
        run: |
          rm -rf _rc3
          mkdir _rc3
          unzip -q ELHARIKA-Electrical-Designer-3D-v2.0.0-RC3-source.zip -d _rc3
          PROJECT_DIR="$(find _rc3 -mindepth 1 -maxdepth 1 -type d | head -1)"
          test -n "$PROJECT_DIR"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Prepare Android SDK 35
        shell: bash
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(command -v sdkmanager)"
          fi
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Structural verification
        working-directory: ${{ env.PROJECT_DIR }}
        run: python tools/verify_project.py

      - name: Validate embedded GLB assets
        working-directory: ${{ env.PROJECT_DIR }}
        run: python tools/validate_electrical_assets.py

      - name: Unit tests
        working-directory: ${{ env.PROJECT_DIR }}
        run: gradle --no-daemon testDebugUnitTest

      - name: Lint
        working-directory: ${{ env.PROJECT_DIR }}
        run: gradle --no-daemon lintDebug

      - name: Build debug and release APKs
        working-directory: ${{ env.PROJECT_DIR }}
        run: gradle --no-daemon assembleDebug assembleRelease

      - name: Upload APKs and reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ELHARIKA-Electrical-Designer-3D-RC3
          path: |
            ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
            ${{ env.PROJECT_DIR }}/app/build/outputs/apk/release/*.apk
            ${{ env.PROJECT_DIR }}/app/build/reports/
          if-no-files-found: warn
