name: Build ELHARIKA Electrical Designer 3D RC3

on:
  workflow_dispatch:
  push:
    paths:
      - 'ELHARIKA-Electrical-Designer-3D-v2.0.0-RC3-source.zip'
      - '.github/workflows/build-rc3-archive.yml'

permissions:
  contents: read

concurrency:
  group: rc3-android-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-slim
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Verify RC3 source archive
        run: |
          test -f ELHARIKA-Electrical-Designer-3D-v2.0.0-RC3-source.zip || {
            echo 'RC3 source ZIP is missing from repository root.'
            exit 1
          }

      - name: Extract source
        run: |
          rm -rf _rc3
          mkdir _rc3
          unzip -q ELHARIKA-Electrical-Designer-3D-v2.0.0-RC3-source.zip -d _rc3
          PROJECT_DIR="$(find _rc3 -mindepth 1 -maxdepth 1 -type d | head -1)"
          test -n "$PROJECT_DIR"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install Android SDK 35
        shell: bash
        run: |
          export ANDROID_HOME="$HOME/android-sdk"
          mkdir -p "$ANDROID_HOME/cmdline-tools/latest"
          curl -fsSL https://dl.google.com/android/repository/commandlinetools-linux-12266719_latest.zip -o /tmp/cmdtools.zip
          rm -rf /tmp/androidcmd
          mkdir -p /tmp/androidcmd
          unzip -q /tmp/cmdtools.zip -d /tmp/androidcmd
          mv /tmp/androidcmd/cmdline-tools/* "$ANDROID_HOME/cmdline-tools/latest/"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Structural verification
        working-directory: ${{ env.PROJECT_DIR }}
        run: python tools/verify_project.py

      - name: Validate embedded GLB assets
        working-directory: ${{ env.PROJECT_DIR }}
        run: python tools/validate_electrical_assets.py

      - name: Unit tests
        working-directory: ${{ env.PROJECT_DIR }}
        run: gradle --no-daemon testDebugUnitTest

      - name: Lint
        working-directory: ${{ env.PROJECT_DIR }}
        run: gradle --no-daemon lintDebug

      - name: Build debug and release APKs
        working-directory: ${{ env.PROJECT_DIR }}
        run: gradle --no-daemon assembleDebug assembleRelease

      - name: Upload APKs and reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ELHARIKA-Electrical-Designer-3D-RC3
          path: |
            ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
            ${{ env.PROJECT_DIR }}/app/build/outputs/apk/release/*.apk
            ${{ env.PROJECT_DIR }}/app/build/reports/
          if-no-files-found: warn
