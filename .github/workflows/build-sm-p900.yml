name: Build SM-P900 Android 10 Compatibility APK

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/build-sm-p900.yml'
      - 'ELHARIKA-Electrical-Designer-3D-v2.0.0-RC3-source.zip'

permissions:
  contents: read

concurrency:
  group: sm-p900-compat-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-slim
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Verify source archive
        run: test -f ELHARIKA-Electrical-Designer-3D-v2.0.0-RC3-source.zip

      - name: Extract source
        run: |
          rm -rf _p900
          mkdir _p900
          unzip -q ELHARIKA-Electrical-Designer-3D-v2.0.0-RC3-source.zip -d _p900
          PROJECT_DIR="$(find _p900 -mindepth 1 -maxdepth 1 -type d | head -1)"
          test -n "$PROJECT_DIR"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Apply SM-P900 compatibility patches
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import os

          root = Path(os.environ['PROJECT_DIR'])

          # Compose opt-in required by RC3 source.
          view = root / 'app/src/main/java/com/elharika/electricaldesigner3d/Real3DView.kt'
          text = view.read_text(encoding='utf-8')
          if 'import androidx.compose.foundation.layout.ExperimentalLayoutApi' not in text:
              text = text.replace(
                  'import androidx.compose.foundation.layout.Column\n',
                  'import androidx.compose.foundation.layout.Column\nimport androidx.compose.foundation.layout.ExperimentalLayoutApi\n'
              )
          if '@OptIn(ExperimentalLayoutApi::class)\n@Composable\nfun Real3DView' not in text:
              text = text.replace(
                  '@Composable\nfun Real3DView',
                  '@OptIn(ExperimentalLayoutApi::class)\n@Composable\nfun Real3DView'
              )
          view.write_text(text, encoding='utf-8')

          # Build a dedicated 32-bit APK for Exynos/SM-P900 and force legacy JNI extraction.
          gradle = root / 'app/build.gradle.kts'
          g = gradle.read_text(encoding='utf-8')
          g = g.replace('versionCode = 209', 'versionCode = 210')
          g = g.replace('versionName = "2.0.0-rc3"', 'versionName = "2.0.0-rc3-p900"')
          if 'abiFilters += listOf("armeabi-v7a")' not in g:
              g = g.replace(
                  'testInstrumentationRunner = "androidx.test.runner.AndroidJUnitRunner"\n',
                  'testInstrumentationRunner = "androidx.test.runner.AndroidJUnitRunner"\n        ndk {\n            abiFilters += listOf("armeabi-v7a")\n        }\n'
              )
          if 'jniLibs.useLegacyPackaging = true' not in g:
              g = g.replace(
                  'packaging {\n        resources.excludes += "/META-INF/{AL2.0,LGPL2.1}"\n',
                  'packaging {\n        jniLibs.useLegacyPackaging = true\n        resources.excludes += "/META-INF/{AL2.0,LGPL2.1}"\n'
              )
          gradle.write_text(g, encoding='utf-8')

          manifest = root / 'app/src/main/AndroidManifest.xml'
          m = manifest.read_text(encoding='utf-8')
          m = m.replace('        android:dataExtractionRules="@xml/data_extraction_rules"\n', '')
          if 'android:extractNativeLibs="true"' not in m:
              m = m.replace(
                  '        android:allowBackup="true"\n',
                  '        android:allowBackup="true"\n        android:extractNativeLibs="true"\n'
              )
          manifest.write_text(m, encoding='utf-8')
          PY

      - name: Install Android SDK 35
        shell: bash
        run: |
          export ANDROID_HOME="$HOME/android-sdk"
          mkdir -p "$ANDROID_HOME/cmdline-tools/latest"
          curl -fsSL https://dl.google.com/android/repository/commandlinetools-linux-12266719_latest.zip -o /tmp/cmdtools.zip
          rm -rf /tmp/androidcmd
          mkdir -p /tmp/androidcmd
          unzip -q /tmp/cmdtools.zip -d /tmp/androidcmd
          mv /tmp/androidcmd/cmdline-tools/* "$ANDROID_HOME/cmdline-tools/latest/"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Structural verification
        working-directory: ${{ env.PROJECT_DIR }}
        run: python tools/verify_project.py

      - name: Validate embedded GLB assets
        working-directory: ${{ env.PROJECT_DIR }}
        run: python tools/validate_electrical_assets.py

      - name: Build SM-P900 debug APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: gradle --no-daemon assembleDebug

      - name: Verify APK contains only armeabi-v7a JNI libs
        shell: bash
        run: |
          APK="$(find "$PROJECT_DIR/app/build/outputs/apk/debug" -name '*.apk' | head -1)"
          test -n "$APK"
          echo "APK_PATH=$APK" >> "$GITHUB_ENV"
          unzip -l "$APK" | grep 'lib/armeabi-v7a/'
          if unzip -l "$APK" | grep -E 'lib/(arm64-v8a|x86|x86_64)/'; then
            echo 'Unexpected non-SM-P900 ABI found in compatibility APK.'
            exit 1
          fi

      - name: Upload SM-P900 APK
        uses: actions/upload-artifact@v4
        with:
          name: ELHARIKA-Electrical-Designer-3D-RC3-SM-P900-Android10
          path: ${{ env.APK_PATH }}
          if-no-files-found: error
